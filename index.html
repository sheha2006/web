<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Marry Me? ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #a1c4fd 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* පසුබිමේ පාවෙන Couple Cartoon පින්තූර සඳහා Style එක */
        .cartoon-bg {
            position: absolute;
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            animation: floatCartoon 8s linear infinite;
            z-index: 1;
            opacity: 0.85;
        }

        @keyframes floatCartoon {
            0% {
                transform: translateY(110vh) scale(0.7) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.9;
            }
            80% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-20vh) scale(1.1) rotate(360deg);
                opacity: 0;
            }
        }

        /* iOS Liquid Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 35px;
            padding: 50px 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInCard 1s ease-out;
        }

        @keyframes fadeInCard {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            color: #d63384;
            margin-bottom: 40px;
            font-size: 30px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
        }

        .button-container {
            position: relative;
            width: 350px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 14px 35px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        #yesBtn {
            background: rgba(40, 167, 69, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            position: absolute;
            left: 40px;
        }

        #yesBtn:hover {
            background: #28a745;
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }

        #noBtn {
            background: rgba(220, 53, 69, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            position: absolute;
            left: 180px;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* පාවෙන හදවත් */
        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.8);
            font-size: 22px;
            animation: floatUp 5s linear infinite;
            z-index: 2;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.6);
                opacity: 0;
            }
            50% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-10vh) scale(1.3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>Will you marry me? ❤️</h1>
        <div class="button-container">
            <button id="yesBtn" onclick="sayYes()">Yes</button>
            <button id="noBtn" onmousemove="moveAway(event)">No</button>
        </div>
    </div>

    <script>
        function sayYes() {
            window.location.href = "date.html";
        }

        function moveAway(e) {
            const noBtn = document.getElementById("noBtn");
            const rect = noBtn.getBoundingClientRect();
            
            const btnX = rect.left + rect.width / 2;
            const btnY = rect.top + rect.height / 2;

            const mouseX = e.clientX;
            const mouseY = e.clientY;

            let deltaX = btnX - mouseX;
            let deltaY = btnY - mouseY;

            const moveDistance = 90;

            let newX = noBtn.offsetLeft + (deltaX > 0 ? moveDistance : -moveDistance);
            let newY = noBtn.offsetTop + (deltaY > 0 ? moveDistance : -moveDistance);

            const maxX = window.innerWidth - noBtn.offsetWidth - 40;
            const maxY = window.innerHeight - noBtn.offsetHeight - 40;

            if (newX < 30) newX = 50;
            if (newX > maxX) newX = maxX - 50;
            if (newY < 30) newY = 50;
            if (newY > maxY) newY = maxY - 50;

            noBtn.style.left = newX + "px";
            noBtn.style.top = newY + "px";
        }

        // ආදරණීය Cartoon Couple පින්තූර ස්වයංක්‍රීයව එකතු කිරීම
        const cartoonImages = [
            "https://i.pinimg.com/736x/8e/58/89/8e58897282b095ef3692cf3ff1421f57.jpg",
            "https://i.pinimg.com/736x/2c/8b/63/2c8b63e52f01fbf9d4791ed385b7e221.jpg",
            "https://i.pinimg.com/736x/13/42/1d/13421d09e53bfa3198031d2799fa7165.jpg"
        ];

        function createCartoon() {
            const img = document.createElement("img");
            img.classList.add("cartoon-bg");
            img.src = cartoonImages[Math.floor(Math.random() * cartoonImages.length)];
            img.style.left = Math.random() * (window.innerWidth - 100) + "px";
            img.style.animationDuration = (Math.random() * 4 + 6) + "s";
            
            document.body.appendChild(img);

            setTimeout(() => {
                img.remove();
            }, 9000);
        }

        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "💖";
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.fontSize = (Math.random() * 20 + 12) + "px";
            heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createCartoon, 3000);
        setInterval(createHeart, 300);
    </script>

</body>
</html>
