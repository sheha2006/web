<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal Page ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        h1 {
            color: #d63384;
            margin-bottom: 40px;
            text-align: center;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .button-container {
            position: relative;
            width: 350px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #yesBtn {
            background-color: #28a745;
            color: white;
            position: absolute;
            left: 50px;
        }

        #noBtn {
            background-color: #dc3545;
            color: white;
            position: absolute;
            left: 200px;
            transition: left 0.4s ease-out, top 0.4s ease-out;
        }

        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            animation: floatUp 4s linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <h1>Will you marry me? ❤️</h1>

    <div class="button-container">
        <button id="yesBtn" onclick="sayYes()">Yes</button>
        <button id="noBtn" onmousemove="moveAway(event)">No</button>
    </div>

    <script>
        function sayYes() {
            window.location.href = "date.html";
        }

        function moveAway(e) {
            const noBtn = document.getElementById("noBtn");
            const rect = noBtn.getBoundingClientRect();
            
            const btnX = rect.left + rect.width / 2;
            const btnY = rect.top + rect.height / 2;

            const mouseX = e.clientX;
            const mouseY = e.clientY;

            let deltaX = btnX - mouseX;
            let deltaY = btnY - mouseY;

            const moveDistance = 80;

            let newX = noBtn.offsetLeft + (deltaX > 0 ? moveDistance : -moveDistance);
            let newY = noBtn.offsetTop + (deltaY > 0 ? moveDistance : -moveDistance);

            const maxX = window.innerWidth - noBtn.offsetWidth - 30;
            const maxY = window.innerHeight - noBtn.offsetHeight - 30;

            if (newX < 20) newX = 50;
            if (newX > maxX) newX = maxX - 50;
            if (newY < 20) newY = 50;
            if (newY > maxY) newY = maxY - 50;

            noBtn.style.left = newX + "px";
            noBtn.style.top = newY + "px";
        }

        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.fontSize = (Math.random() * 20 + 10) + "px";
            heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 300);
    </script>

</body>
</html>
