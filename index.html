<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Marry Me? ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* iOS වර්ණ ස්වභාවය ගෙන දෙන පසුබිම් ග්‍රේඩියන්ට් එකක් */
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Liquid Glass Card එක (iOS Style) */
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInCard 1s ease-out;
        }

        @keyframes fadeInCard {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            color: #ffffff;
            margin-bottom: 40px;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15);
        }

        .button-container {
            position: relative;
            width: 350px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 14px 35px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        #yesBtn {
            background: rgba(40, 167, 69, 0.85);
            backdrop-filter: blur(10px);
            color: white;
            position: absolute;
            left: 40px;
        }

        #yesBtn:hover {
            background: #28a745;
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }

        #noBtn {
            background: rgba(220, 53, 69, 0.85);
            backdrop-filter: blur(10px);
            color: white;
            position: absolute;
            left: 180px;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* පසුබිමේ පාවෙන බුබුළු/හදවත් සජීවීකරණය */
        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.7);
            font-size: 22px;
            animation: floatUp 5s linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>Will you marry me? ❤️</h1>
        <div class="button-container">
            <button id="yesBtn" onclick="sayYes()">Yes</button>
            <button id="noBtn" onmousemove="moveAway(event)">No</button>
        </div>
    </div>

    <script>
        function sayYes() {
            window.location.href = "date.html";
        }

        function moveAway(e) {
            const noBtn = document.getElementById("noBtn");
            const rect = noBtn.getBoundingClientRect();
            
            const btnX = rect.left + rect.width / 2;
            const btnY = rect.top + rect.height / 2;

            const mouseX = e.clientX;
            const mouseY = e.clientY;

            let deltaX = btnX - mouseX;
            let deltaY = btnY - mouseY;

            const moveDistance = 90;

            let newX = noBtn.offsetLeft + (deltaX > 0 ? moveDistance : -moveDistance);
            let newY = noBtn.offsetTop + (deltaY > 0 ? moveDistance : -moveDistance);

            const maxX = window.innerWidth - noBtn.offsetWidth - 40;
            const maxY = window.innerHeight - noBtn.offsetHeight - 40;

            if (newX < 30) newX = 50;
            if (newX > maxX) newX = maxX - 50;
            if (newY < 30) newY = 50;
            if (newY > maxY) newY = maxY - 50;

            noBtn.style.left = newX + "px";
            noBtn.style.top = newY + "px";
        }

        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.fontSize = (Math.random() * 20 + 12) + "px";
            heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 250);
    </script>

</body>
</html>
