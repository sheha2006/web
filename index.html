<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Marry Me? ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #7afcff 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* පසුබිමේ වටකුරු බෝල මෙන් පාවෙන පින්තූර */
        .bubble-img {
            position: absolute;
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%; /* සම්පූර්ණ වටකුරු බෝල ස්වභාවය */
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            filter: blur(2px); /* මඳක් බ්ලර් වී පෙනීමට */
            animation: floatBubble 8s linear infinite;
            z-index: 1;
            opacity: 0.85;
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .bubble-img:hover {
            filter: blur(0px);
            opacity: 1;
            transform: scale(1.1);
        }

        @keyframes floatBubble {
            0% {
                transform: translateY(110vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.85;
            }
            80% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(-20vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* iOS Liquid Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 35px;
            padding: 50px 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInCard 1s ease-out;
        }

        @keyframes fadeInCard {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            color: #b91c5c;
            margin-bottom: 40px;
            font-size: 32px;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
        }

        .button-container {
            position: relative;
            width: 350px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 14px 35px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        #yesBtn {
            background: #28a745;
            color: white;
            position: absolute;
            left: 40px;
        }

        #yesBtn:hover {
            background: #218838;
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.5);
        }

        #noBtn {
            background: #dc3545;
            color: white;
            position: absolute;
            left: 180px;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>Will you marry me? ❤️</h1>
        <div class="button-container">
            <button id="yesBtn" onclick="sayYes()">Yes</button>
            <button id="noBtn" onmousemove="moveAway(event)">No</button>
        </div>
    </div>

    <script>
        function sayYes() {
            window.location.href = "date.html";
        }

        function moveAway(e) {
            const noBtn = document.getElementById("noBtn");
            const rect = noBtn.getBoundingClientRect();
            
            const btnX = rect.left + rect.width / 2;
            const btnY = rect.top + rect.height / 2;

            const mouseX = e.clientX;
            const mouseY = e.clientY;

            let deltaX = btnX - mouseX;
            let deltaY = btnY - mouseY;

            const moveDistance = 90;

            let newX = noBtn.offsetLeft + (deltaX > 0 ? moveDistance : -moveDistance);
            let newY = noBtn.offsetTop + (deltaY > 0 ? moveDistance : -moveDistance);

            const maxX = window.innerWidth - noBtn.offsetWidth - 40;
            const maxY = window.innerHeight - noBtn.offsetHeight - 40;

            if (newX < 30) newX = 50;
            if (newX > maxX) newX = maxX - 50;
            if (newY < 30) newY = 50;
            if (newY > maxY) newY = maxY - 50;

            noBtn.style.left = newX + "px";
            noBtn.style.top = newY + "px";
        }

        /* ඔබ ලබා දුන් පින්තූර සියල්ල ඇතුළත් ලැයිස්තුව */
        const bubbleImages = [
            "https://i.pinimg.com/736x/df/d3/db/dfd3db6eef6c29bf07a9eeee75b34249.jpg",
            "https://i.pinimg.com/736x/dd/f6/53/ddf6538eb24e8b8c4a65efb1904757b3.jpg",
            "https://i.pinimg.com/736x/fc/e9/5b/fce95b8064545265e918525f19ecc672.jpg",
            "https://i.pinimg.com/736x/2d/aa/aa/2daaaa716c1b43051e324a7cb80ab1b2.jpg",
            "https://i.pinimg.com/736x/7c/5b/bf/7c5bbfbcc764d28c5ed15fd585008354.jpg",
            "https://i.pinimg.com/736x/2f/b8/70/2fb870cf0cdbdd1899405a5d7048f135.jpg"
        ];

        function createBubble() {
            const img = document.createElement("img");
            img.classList.add("bubble-img");
            img.src = bubbleImages[Math.floor(Math.random() * bubbleImages.length)];
            img.style.left = Math.random() * (window.innerWidth - 120) + "px";
            img.style.animationDuration = (Math.random() * 4 + 6) + "s";
            
            document.body.appendChild(img);

            setTimeout(() => {
                img.remove();
            }, 9000);
        }

        setInterval(createBubble, 2500);
    </script>

</body>
</html>
