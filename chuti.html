<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuti's Question ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #7afcff 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 35px;
            padding: 50px 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            text-align: center;
            z-index: 10;
        }

        h1 {
            color: #b91c5c;
            margin-bottom: 30px;
            font-size: 36px;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
        }

        .back-btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, rgba(216, 27, 96, 0.85), rgba(180, 20, 70, 0.85));
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(216, 27, 96, 0.3);
            transition: transform 0.3s ease;
        }

        .back-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>පුංචි සුදු ද? ❤️</h1>
        <a href="index.html" class="back-btn">ආපසු යන්න</a>
    </div>

</body>
</html>
