<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuti's Question ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #7afcff 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 35px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            text-align: center;
            z-index: 10;
            width: 320px;
        }

        h1 {
            color: #b91c5c;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 30px;
            padding-left: 20px;
        }

        .option-label {
            font-size: 18px;
            font-weight: 700;
            color: #881337;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="radio"] {
            transform: scale(1.3);
            accent-color: #b91c5c;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .action-btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, rgba(216, 27, 96, 0.85), rgba(180, 20, 70, 0.85));
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(216, 27, 96, 0.3);
            transition: transform 0.3s ease;
        }

        .action-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>පුම්ක සුදුද? ❤️</h1>
        
        <div class="options-container">
            <label class="option-label">
                <input type="radio" name="answer" value="sudui"> ඔව් සුදුයි
            </label>
            <label class="option-label">
                <input type="radio" name="answer" value="kalui"> නෑ කලුයි
            </label>
            <label class="option-label">
                <input type="radio" name="answer" value="thalelui"> තලෙලුයි
            </label>
        </div>

        <div class="btn-group">
            <a href="index.html" class="action-btn">Back</a>
            <button class="action-btn" onclick="submitAnswer()">Submit</button>
        </div>
    </div>

    <script>
        function submitAnswer() {
            const selected = document.querySelector('input[name="answer"]:checked');
            if (!selected) {
                alert("කරුණාකර පිළිතුරක් තෝරන්න! ❤️");
                return;
            }
            alert("ස්තුතියි! ඔබේ පිළිතුර සාර්ථකව යොමු විය. ❤️");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
