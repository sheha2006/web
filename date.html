<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Wedding Date ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #7afcff 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .bg-large-img {
            position: absolute;
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 30px;
            border: 4px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
        }

        #bgImg1 {
            top: 10%;
            left: 5%;
            transform: rotate(-10deg);
        }

        #bgImg2 {
            bottom: 10%;
            right: 5%;
            transform: rotate(10deg);
        }

        .chuti-bubble {
            position: absolute;
            top: 40px;
            right: 60px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            padding: 12px 28px;
            border-radius: 50px;
            color: #d81b60;
            font-size: 24px;
            font-weight: 800;
            box-shadow: 0 10px 25px rgba(216, 27, 96, 0.25);
            z-index: 20;
            animation: pulseChuti 2.5s ease-in-out infinite, floatChuti 4s ease-in-out infinite;
        }

        @keyframes pulseChuti {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 10px 25px rgba(216, 27, 96, 0.25);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 15px 35px rgba(216, 27, 96, 0.45);
            }
        }

        @keyframes floatChuti {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-8px) rotate(3deg);
            }
        }

        .bubble-img {
            position: absolute;
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: floatBubble 8s linear infinite;
            z-index: 2;
            opacity: 0.95;
            transition: transform 0.3s ease;
        }

        .bubble-img:hover {
            transform: scale(1.15);
        }

        @keyframes floatBubble {
            0% {
                transform: translateY(110vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.95;
            }
            80% {
                opacity: 0.95;
            }
            100% {
                transform: translateY(-20vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 35px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            text-align: center;
            z-index: 10;
            max-width: 400px;
            width: 85%;
            animation: fadeInCard 1s ease-out;
        }

        @keyframes fadeInCard {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            color: #b91c5c;
            font-size: 26px;
            margin-bottom: 25px;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
        }

        input[type="date"] {
            padding: 14px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            outline: none;
            margin-bottom: 25px;
            width: 80%;
            cursor: pointer;
            color: #333;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        button {
            padding: 14px 35px;
            font-size: 18px;
            font-weight: 700;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: 0.2s;
        }

        button:hover {
            background: #218838;
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.5);
        }
    </style>
</head>
<body>

    <div class="chuti-bubble">Chuti ❤️</div>

    <img id="bgImg1" class="bg-large-img" src="https://i.pinimg.com/736x/7c/5b/bf/7c5bbfbcc764d28c5ed15fd585008354.jpg" alt="Background Photo 1">
    <img id="bgImg2" class="bg-large-img" src="https://i.pinimg.com/736x/2f/b8/70/2fb870cf0cdbdd1899405a5d7048f135.jpg" alt="Background Photo 2">

    <div class="glass-card">
        <h1>When should we get married? 🥰</h1>
        <input type="date" id="weddingDate"><br>
        <button onclick="sendToWhatsApp()">Confirm & Send ❤️</button>
    </div>

    <script>
        function sendToWhatsApp() {
            const selectedDate = document.getElementById("weddingDate").value;
            
            if(selectedDate === "") {
                alert("Please select a date! 😊");
                return;
            }

            const phoneNumber = "947XXXXXXXX"; // ඔබේ WhatsApp අංකය මෙහි යොදන්න

            const message = `I said Yes to marrying you! ❤️ I chose our special day to be on ${selectedDate}. 💍✨`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }

        const bubbleImages = [
            "https://i.pinimg.com/736x/df/d3/db/dfd3db6eef6c29bf07a9eeee75b34249.jpg",
            "https://i.pinimg.com/736x/dd/f6/53/ddf6538eb24e8b8c4a65efb1904757b3.jpg",
            "https://i.pinimg.com/736x/fc/e9/5b/fce95b8064545265e918525f19ecc672.jpg",
            "https://i.pinimg.com/736x/2d/aa/aa/2daaaa716c1b43051e324a7cb80ab1b2.jpg",
            "https://i.pinimg.com/736x/7c/5b/bf/7c5bbfbcc764d28c5ed15fd585008354.jpg",
            "https://i.pinimg.com/736x/2f/b8/70/2fb870cf0cdbdd1899405a5d7048f135.jpg"
        ];

        function createBubble() {
            const img = document.createElement("img");
            img.classList.add("bubble-img");
            img.src = bubbleImages[Math.floor(Math.random() * bubbleImages.length)];
            img.style.left = Math.random() * (window.innerWidth - 120) + "px";
            img.style.animationDuration = (Math.random() * 4 + 6) + "s";
            
            document.body.appendChild(img);

            setTimeout(() => {
                img.remove();
            }, 9000);
        }

        setInterval(createBubble, 2500);
    </script>

</body>
</html>
