<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Wedding Date ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #7afcff 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .cartoon-bg {
            position: absolute;
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
            animation: floatCartoon 7s linear infinite;
            z-index: 1;
            opacity: 0.95;
        }

        @keyframes floatCartoon {
            0% {
                transform: translateY(110vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.95;
            }
            85% {
                opacity: 0.95;
            }
            100% {
                transform: translateY(-20vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 35px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            text-align: center;
            z-index: 10;
            max-width: 400px;
            width: 85%;
            animation: fadeInCard 1s ease-out;
        }

        @keyframes fadeInCard {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            color: #b91c5c;
            font-size: 26px;
            margin-bottom: 25px;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
        }

        input[type="date"] {
            padding: 14px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            outline: none;
            margin-bottom: 25px;
            width: 80%;
            cursor: pointer;
            color: #333;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        button {
            padding: 14px 35px;
            font-size: 18px;
            font-weight: 700;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: 0.2s;
        }

        button:hover {
            background: #218838;
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.5);
        }

        .heart {
            position: absolute;
            color: rgba(255, 20, 147, 0.85);
            font-size: 24px;
            animation: floatUp 5s linear infinite;
            z-index: 2;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.6);
                opacity: 0;
            }
            50% {
                opacity: 0.95;
            }
            100% {
                transform: translateY(-10vh) scale(1.3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>When should we get married? 🥰</h1>
        <input type="date" id="weddingDate"><br>
        <button onclick="sendToWhatsApp()">Confirm & Send ❤️</button>
    </div>

    <script>
        function sendToWhatsApp() {
            const selectedDate = document.getElementById("weddingDate").value;
            
            if(selectedDate === "") {
                alert("Please select a date! 😊");
                return;
            }

            // ඔබේ WhatsApp අංකය මෙහි යොදන්න (උදා: 94712345678)
            const phoneNumber = "947XXXXXXXX"; 

            const message = `I said Yes to marrying you! ❤️ I chose our special day to be on ${selectedDate}. 💍✨`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }

        const cartoonImages = [
            "https://i.ibb.co/30Z1H4C/image-1f172e.png",
            "https://i.pinimg.com/736x/8e/58/89/8e58897282b095ef3692cf3ff1421f57.jpg",
            "https://i.pinimg.com/736x/2c/8b/63/2c8b63e52f01fbf9d4791ed385b7e221.jpg",
            "https://i.pinimg.com/736x/13/42/1d/13421d09e53bfa3198031d2799fa7165.jpg"
        ];

        function createCartoon() {
            const img = document.createElement("img");
            img.classList.add("cartoon-bg");
            img.src = cartoonImages[Math.floor(Math.random() * cartoonImages.length)];
            img.style.left = Math.random() * (window.innerWidth - 100) + "px";
            img.style.animationDuration = (Math.random() * 4 + 5) + "s";
            
            document.body.appendChild(img);

            setTimeout(() => {
                img.remove();
            }, 8000);
        }

        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "💖";
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.fontSize = (Math.random() * 20 + 14) + "px";
            heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createCartoon, 2500);
        setInterval(createHeart, 250);
    </script>

</body>
</html>
